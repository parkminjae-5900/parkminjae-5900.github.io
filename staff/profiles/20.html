<script>
const PHONE="16006131";
const DISPLAY_PHONE="1600-6131";
const SHARE_URL="https://www.dahamsangjo.co.kr/staff/profiles/20.html";
const SHARE_TITLE="안세내 | 다함상조 의전팀장";
const SHARE_TEXT="안세내 · 의전팀장 · 6년차 · 24시간 장례상담";

function isMobile(){return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);}

function sendSms(){
  const msg=encodeURIComponent(SHARE_TITLE+"\n"+SHARE_TEXT+"\n"+SHARE_URL);
  if(isMobile()){
    const isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    location.href=isiOS ? `sms:${PHONE}&body=${msg}` : `sms:${PHONE}?body=${msg}`;
  } else {
    copyText(DISPLAY_PHONE+"\n"+SHARE_URL, "전화번호와 명함 링크를 복사했습니다.");
  }
}

async function copyText(text,msg){
  try{await navigator.clipboard.writeText(text);alert(msg);}
  catch(e){prompt("복사하세요.",text);}
}

async function copyLink(){
  await copyText(SHARE_URL,"명함 링크를 복사했습니다.");
}

async function shareCard(){
  const data={title:SHARE_TITLE,text:SHARE_TEXT,url:SHARE_URL};
  try{
    if(navigator.share) await navigator.share(data);
    else await copyLink();
  }catch(e){ if(e && e.name!=="AbortError") await copyLink(); }
}
</script>
