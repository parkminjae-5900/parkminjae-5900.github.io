<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>온결 계산 규칙 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#183732;font:18px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:30px}section{background:white;border:1px solid #cbd7d0;border-radius:12px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;margin:12px 0}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #82988e;border-radius:6px}button{background:#194e42;color:white;cursor:pointer}.notice{background:#fff1ce;padding:16px}.amount{font-size:28px;font-weight:bold}li{margin:9px 0;overflow-wrap:anywhere}.pending{color:#785600}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:14px}section{padding:15px}}@media print{.controls,button{display:none}body{background:white}main{padding:0}.grid{display:block}section{break-inside:avoid}h1{font-size:24px}}</style>
<main><h1>온결 공통 계산 규칙 검수</h1><p class="notice">개발용 비교 화면입니다. 표시액은 확인된 항목의 소계이며 최종 장례비가 아닙니다. 고객용 홈페이지에는 연결하지 않았습니다.</p>
<section class="controls"><h2>같은 조건으로 두 계산 경로 비교</h2><div class="grid"><div><label for="product">상품</label><select id="product"><option value="nobinso">무빈소 120만원</option><option value="family249">가족장 249만원</option><option value="general360">일반장 360만원</option><option value="premium499">프리미엄 499만원</option></select></div><div><label for="days">지도사 필요 일수</label><input id="days" type="number" min="1" step="1" value="3"></div><div><label for="helper">도우미 필요 인원(1회 기준)</label><input id="helper" type="number" min="0" step="1" value="0"></div><div><label for="vehicle">리무진</label><select id="vehicle"><option value="0">선택 없음</option><option value="1">1회 필요 · 포함 범위 확인</option></select></div><div><label for="shroud">수의</label><select id="shroud"><option value="0">기본 구성 유지</option><option value="1">육수청홍수의 선택 · 교체 차액 미확인</option></select></div><div><label for="hours">빈소 필요 시간</label><input id="hours" type="number" min="0" step="1" value="48"></div><div><label for="fee">미확인 시설 시간당 참고액(원)</label><input id="fee" type="number" min="0" step="1" placeholder="입력해도 확인 전 합산되지 않습니다"></div></div><p>시설·호실과 적용 요금의 검증 근거를 입력받는 운영 기능은 연결 전입니다. 이 화면에서 참고액을 공식가격으로 승인할 수 없습니다.</p></section>
<p id="status" role="status"></p><div id="results" class="grid"></div><button id="print">검수 결과 인쇄</button><p>미확인 상품 구성은 별도 확인이 필요합니다. 빈소 미사용이어도 안치·입관실 비용은 남을 수 있습니다.</p></main><script type="module" src="screen.mjs"></script></html>
