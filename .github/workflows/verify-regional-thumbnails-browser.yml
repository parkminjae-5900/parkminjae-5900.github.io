name: Verify regional thumbnail browser layouts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QA_OUT: regional-thumbnail-browser-output
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize durable failure report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['QA_OUT'])
          out.mkdir(parents=True, exist_ok=True)
          (out / 'report.json').write_text(json.dumps({
              'result': 'FAIL', 'checked_viewports': 0,
              'failures': [{'stage': 'CI setup', 'error': 'Browser verification has not completed; inspect workflow logs.'}]
          }, indent=2) + '\n')
          PY
      - name: Install pinned browser client and image decoder
        run: python -m pip install 'playwright==1.58.0' Pillow
      - name: Install isolated Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Install and verify local Korean font coverage
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fontconfig
          fc-match ':lang=ko' | tee "$QA_OUT/korean-font.txt"
          fc-match 'Noto Sans CJK KR:lang=ko' | tee -a "$QA_OUT/korean-font.txt" | grep -qi 'Noto.*CJK'
      - name: Test browser contracts without launching a browser
        run: python -m unittest discover -s tests -p 'test_regional_browser_contract.py'
      - name: Check every accepted page at mobile and desktop widths
        run: >-
          python scripts/verify_regional_thumbnails_browser.py
          --out "$QA_OUT" --widths 360 390 430 1280 --capture 64 --minimum-count 269
      - name: Upload durable report and bounded screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-thumbnail-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_OUT }}
          if-no-files-found: error
          retention-days: 14
