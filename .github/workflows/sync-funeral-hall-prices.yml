name: Sync funeral hall price baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/import_funeral_hall_price_baseline.py"
      - ".github/workflows/sync-funeral-hall-prices.yml"
  schedule:
    - cron: "35 18 1 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 openpyxl
      - name: Import reusable public price baseline
        run: python scripts/import_funeral_hall_price_baseline.py
      - name: Validate price dataset
        run: |
          python - <<'PY'
          import json
          with open("data/funeral-hall-prices.json",encoding="utf-8") as f:d=json.load(f)
          if d.get("source",{}).get("datasetId")!="15021763":
              raise SystemExit("unexpected source dataset")
          if int(d.get("pricedFacilities",0)) < 10:
              raise SystemExit("too few priced facilities")
          print("validated",d.get("pricedFacilities"))
          PY
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funeral-hall-prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "chore: refresh funeral hall price baseline"
          git pull --rebase origin main
          git push
