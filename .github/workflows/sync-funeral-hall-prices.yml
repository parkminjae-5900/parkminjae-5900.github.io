name: Sync funeral hall price baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/source/2.장례식장가격정보_20230601.csv"
      - "data/source/2.장례식장가격정보_20230601(1).csv"
      - "scripts/import_funeral_hall_price_baseline.py"
      - ".github/workflows/sync-funeral-hall-prices.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 openpyxl
      - name: Import reusable public price baseline
        id: import
        run: |
          set +e
          python scripts/import_funeral_hall_price_baseline.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "PublicData download is protected by CAPTCHA. Existing price DB is preserved."
          fi
          exit 0
      - name: Validate when baseline exists
        run: |
          python - <<'PY'
          import json, os
          p="data/funeral-hall-prices.json"
          if not os.path.exists(p):
              print("No baseline DB yet; nothing to validate")
              raise SystemExit(0)
          with open(p,encoding="utf-8") as f:d=json.load(f)
          count=len(d.get("items",[]))
          if count==0:
              print("Price baseline not populated yet; existing empty DB preserved")
              raise SystemExit(0)
          if count < 10:
              raise SystemExit(f"suspiciously small price dataset: {count}")
          print("validated",count,"priced facilities")
          PY
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funeral-hall-prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "chore: refresh funeral hall price baseline"
          git pull --rebase origin main
          git push
