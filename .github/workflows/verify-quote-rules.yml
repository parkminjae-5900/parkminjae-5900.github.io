name: Verify development quote rules
on:
  push:
    branches: [dev/unified-quote-rules-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/quote-rules/engine.test.mjs
      - run: npm install --prefix /tmp/quote-tools playwright@1.62.1
      - run: /tmp/quote-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/quote-http.log 2>&1 &
          NODE_PATH=/tmp/quote-tools/node_modules node tests/quote-rules/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-quote-screens-and-print
          path: /tmp/quote-qa/
