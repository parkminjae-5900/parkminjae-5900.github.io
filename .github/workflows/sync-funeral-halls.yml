name: Sync nationwide funeral halls

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_funeral_halls.py"
      - ".github/workflows/sync-funeral-halls.yml"
  schedule:
    - cron: "15 18 * * *"

concurrency:
  group: daham-validated-content-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public funeral-hall data
        env:
          FUNERAL_API_KEY: ${{ secrets.FUNERAL_API_KEY }}
        run: python scripts/update_funeral_halls.py
      - name: Validate fetched dataset
        run: |
          python - <<'PY'
          import json
          with open("data/funeral-halls.json", encoding="utf-8") as f:
              d=json.load(f)
          count=int(d.get("count",0))
          items=d.get("items",[])
          regions=d.get("regions",{})
          if count != len(items):
              raise SystemExit(f"Dataset validation failed: count={count}, items={len(items)}")
          if len(regions) != 17:
              raise SystemExit(f"Dataset validation failed: only {len(regions)} regions")
          if count < 1000:
              raise SystemExit(f"Dataset validation failed: only {count} records")
          print(f"Validated {count} funeral halls across {len(regions)} regions")
          PY
      - name: Rebuild source-record directory and preserve reviewed identities
        run: |
          python -m pip install Pillow
          python scripts/build_family_nohall_seo.py --write
          python scripts/build_family_nohall_seo.py --check
          python -m unittest discover -s tests -p 'test_family_nohall_seo.py'
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funeral-halls.json data/family-nohall-coverage.json data/funeral-hall-page-plan.json funeral-halls sitemap.xml
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: refresh nationwide funeral halls"
          git pull --rebase origin main
          git push
